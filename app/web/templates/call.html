{% extends "base.html" %}

{% block content %}
<section class="call-page">
  <h1>Llamada de seguimiento postoperatorio</h1>
  <p class="mic-note">La llamada usa su micrófono. Acepte el permiso del navegador.</p>

  <div class="call-controls">
    <button id="call-btn" class="call-btn" type="button">📞 Iniciar llamada</button>
    <button id="mute-btn" class="mute-btn" type="button" disabled aria-pressed="false"
            title="Silencia la voz del agente; la llamada sigue activa y él sigue escuchando">
      🔊 Silenciar
    </button>
    <span class="voice-label">Voz: Marcela (acento colombiano)</span>
    <span id="call-status" class="call-status" data-state="disconnected">Desconectado</span>
  </div>

  <p id="call-error" class="call-error" hidden></p>

  <div id="transcript" class="transcript" aria-live="polite">
    <p id="transcript-empty" class="transcript-empty">La transcripción aparecerá aquí durante la llamada.</p>
  </div>
</section>

<style>
  .call-page { max-width: 720px; margin: 0 auto; }
  .mic-note { color: #4a6b68; font-size: 0.9rem; }
  .call-controls { display: flex; align-items: center; gap: 1rem; margin: 1rem 0; flex-wrap: wrap; }
  .voice-label { font-size: 0.9rem; color: #4a6b68; }
  .call-btn {
    font-size: 1.25rem; padding: 0.9rem 2rem; border: none; border-radius: 999px;
    cursor: pointer; background: var(--valai-turquesa); color: var(--valai-petroleo);
  }
  .call-btn.in-call { background: #c0392b; }
  .call-btn:disabled { opacity: 0.6; cursor: wait; }
  .mute-btn {
    font-size: 0.95rem; padding: 0.6rem 1.1rem; border-radius: 999px;
    border: 1px solid #ccc; background: #fff; color: #333; cursor: pointer;
  }
  .mute-btn[aria-pressed="true"] { background: #4a4a4a; color: #fff; border-color: #4a4a4a; }
  .mute-btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .call-status { font-weight: 600; }
  .call-status[data-state="disconnected"] { color: #777; }
  .call-status[data-state="connecting"] { color: #b9770e; }
  .call-status[data-state="listening"] { color: var(--valai-turquesa); }
  .call-status[data-state="speaking"] { color: var(--valai-petroleo); }
  .call-error { color: #c0392b; }
  .transcript {
    border: 1px solid var(--valai-borde); border-radius: 8px; padding: 1rem; height: 340px;
    overflow-y: auto; display: flex; flex-direction: column; gap: 0.75rem; background: #fbfefe;
  }
  .transcript-empty { color: #999; margin: auto; }
  .bubble-row { display: flex; flex-direction: column; max-width: 75%; }
  .bubble-row.agent { align-self: flex-start; align-items: flex-start; }
  .bubble-row.patient { align-self: flex-end; align-items: flex-end; }
  .bubble-label { font-size: 0.75rem; color: #666; margin-bottom: 2px; }
  .bubble { padding: 0.5rem 0.85rem; border-radius: 12px; line-height: 1.35; }
  .agent .bubble { background: var(--valai-menta); border-bottom-left-radius: 4px; }
  .patient .bubble { background: #dcf3e3; border-bottom-right-radius: 4px; }
</style>
<script type="module" src="/static/call.js"></script>
{% endblock %}
